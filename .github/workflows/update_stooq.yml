name: Stooq Adatfrissites es Pages Deploy

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reset_history:
        description: 'Chart torteneti naplo (bet_history.json) nullazasa most'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4

      - name: BET adatok es 10 perces torteneti naplo (bet_history.json) frissitese
        env:
          RESET_HISTORY: ${{ github.event.inputs.reset_history || 'false' }}
        run: |
          python3 - << 'EOF'
          import os
          import urllib.request
          import urllib.parse
          import json
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          PAGES_HISTORY_URL = "https://danielgyorfi.github.io/kicsi_bet/bet_history.json"
          reset_flag = os.environ.get("RESET_HISTORY", "false").lower() == "true"

          TICKERS = [
              "^bux", "eurhuf",
              "4ig.hu", "akko.hu", "alteo.hu", "amixa.hu", "any.hu", "appeninn.hu", "autowallis.hu", "bet.hu",
              "bgreit.hu", "bif.hu", "cigpannonia.hu", "civita.hu", "delta.hu", "dhgroup.hu", "dmker.hu", "enefi.hu",
              "enefiels.hu", "eproliusia.hu", "esense.hu", "finext.hu", "finextb.hu", "forrasoe.hu", "forrast.hu",
              "futuraqua.hu", "gloster.hu", "goodwillphrm.hu", "granit.hu", "gspark.hu", "masterplast.hu", "mbhbank.hu",
              "mbhjb.hu", "megakran.hu", "mol.hu", "mtel.hu", "nordgeneral.hu", "nutex.hu", "opus.hu", "ormester.hu",
              "otp.hu", "pannergy.hu", "pensum.hu", "raba.hu", "richt.hu", "splus.hu", "strt.hu", "sundell.hu",
              "ubm.hu", "uplaza.hu", "vertikal.hu", "vig.hu", "waberers.hu", "zwack.hu",
              "astrasun.hu", "biggeorge.hu", "cdsys.hu", "chome.hu", "coolklima.hu", "deltakamatoz.hu",
              "energyinvest.hu", "epduferr.hu", "glia.hu", "gopd.hu", "kermannit.hu", "metmax.hu", "multihome.hu",
              "nap.hu", "naturland.hu", "navigator.hu", "o3pnrs.hu", "polyduct.hu", "valberg.hu", "vvt.hu"
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/csv,text/plain,*/*",
              "Referer": "https://stooq.com/"
          }

          now_bp = datetime.now(ZoneInfo("Europe/Budapest"))
          today_str = now_bp.strftime("%Y-%m-%d")
          slot_min = (now_bp.minute // 10) * 10
          current_slot = f"{now_bp.strftime('%H')}:{slot_min:02d}"

          rows = ["Symbol,Date,Time,Open,High,Low,Close,Volume,Name"]
          stooq_ok = False

          # 1. Kiserlet: Stooq lekerdezes 15-os csomagokban
          stooq_lines = []
          for i in range(0, len(TICKERS), 15):
              chunk = TICKERS[i:i+15]
              s_param = "+".join([urllib.parse.quote(t) for t in chunk])
              url = f"https://stooq.com/q/l/?s={s_param}&f=sd2t2ohlcvn&h&e=csv"
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      text = resp.read().decode("utf-8", errors="ignore").strip()
                      lines = text.splitlines()
                      if len(lines) > 1 and "Symbol,Date" in lines[0] and "<title>" not in text:
                          stooq_lines.extend(lines[1:])
              except Exception as e:
                  print(f"Stooq chunk hiba: {e}")
              time.sleep(0.6)

          if len(stooq_lines) >= 10:
              print(f"Stooq sikeres: {len(stooq_lines)} sor letoltve.")
              rows.extend(stooq_lines)
              stooq_ok = True
          else:
              print("Stooq blokkolta a GitHub IP-t vagy ures valaszt adott, atvaltas Yahoo Finance (.BD) lekerdezesre...")

          # 2. Kiserlet: Yahoo Finance .BD vegpontok
          if not stooq_ok:
              YF_MAP = {
                  "^bux": "^BUX",
                  "eurhuf": "EURHUF=X",
                  "mtel.hu": "MTEL.BD",
                  "richt.hu": "RICHT.BD",
                  "forrasoe.hu": "FORRAS-OE.BD",
                  "forrast.hu": "FORRAS-T.BD"
              }
              for t in TICKERS:
                  yf_sym = YF_MAP.get(t, t.replace(".hu", ".BD").upper())
                  stooq_sym = t.upper()
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(yf_sym)}?interval=1d&range=2d"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": HEADERS["User-Agent"]})
                      with urllib.request.urlopen(req, timeout=6) as resp:
                          data = json.loads(resp.read().decode("utf-8"))
                          meta = data["chart"]["result"][0]["meta"]
                          price = meta.get("regularMarketPrice", "N/D")
                          prev = meta.get("chartPreviousClose", meta.get("previousClose", price))
                          high = meta.get("regularMarketDayHigh", price)
                          low = meta.get("regularMarketDayLow", price)
                          vol = meta.get("regularMarketVolume", 0)
                          ts = meta.get("regularMarketTime", int(time.time()))
                          dt = datetime.fromtimestamp(ts, tz=ZoneInfo("Europe/Budapest"))
                          d_str = dt.strftime("%Y-%m-%d")
                          t_str = dt.strftime("%H:%M:%S")
                          rows.append(f"{stooq_sym},{d_str},{t_str},{prev},{high},{low},{price},{vol},{stooq_sym}")
                  except Exception:
                      rows.append(f"{stooq_sym},N/D,N/D,N/D,N/D,N/D,N/D,N/D,{stooq_sym}")
                  time.sleep(0.1)

          # Meglevo aznapi bet_history.json betoltese az elo GitHub Pages oldalrol (ha nem kertunk nullazast)
          history_data = {"date": today_str, "series": {}}
          if not reset_flag:
              try:
                  req_h = urllib.request.Request(f"{PAGES_HISTORY_URL}?_t={int(time.time())}", headers={"User-Agent": HEADERS["User-Agent"]})
                  with urllib.request.urlopen(req_h, timeout=6) as resp_h:
                      loaded_h = json.loads(resp_h.read().decode("utf-8"))
                      if isinstance(loaded_h, dict) and loaded_h.get("date") == today_str and isinstance(loaded_h.get("series"), dict):
                          history_data = loaded_h
              except Exception:
                  pass

          # Aktualis 10 perces arfolyamok hozzafuzese a bet_history.json-hoz
          for line in rows[1:]:
              cols = line.split(",")
              if len(cols) >= 7:
                  sym = cols[0].strip().upper()
                  try:
                      open_p = float(cols[3])
                  except Exception:
                      open_p = None
                  try:
                      close_p = float(cols[6])
                  except Exception:
                      close_p = open_p

                  if close_p is not None and close_p > 0:
                      pts = history_data["series"].setdefault(sym, [])
                      if "09:00" <= current_slot <= "17:10":
                          existing = next((p for p in pts if p.get("time") == current_slot), None)
                          if existing:
                              existing["price"] = close_p
                          else:
                              pts.append({"time": current_slot, "price": close_p})
                      pts.sort(key=lambda x: x.get("time", ""))
                      history_data["series"][sym] = pts[-60:]

          with open("bet_history.json", "w", encoding="utf-8") as fh:
              json.dump(history_data, fh, ensure_ascii=False)

          if len(rows) > 1:
              rows.append(f"#GENERATED_AT,{today_str},{now_bp.strftime('%H:%M:%S')}")
              with open("bet_data.csv", "w", encoding="utf-8") as f:
                  f.write("\n".join(rows) + "\n")
              print(f"bet_data.csv es bet_history.json sikeresen mentve ({current_slot}).")
          EOF

      - name: GitHub Pages beallitasa
        uses: actions/configure-pages@v5

      - name: Fajlok becsomagolasa a Pages-hez (index.html + bet_data.csv + bet_history.json)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy a GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
