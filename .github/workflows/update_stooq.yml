name: Stooq Adatfrissites es Pages Deploy

on:
  push:
    branches: [ main, master ]
  schedule:
    # Hétfőtől péntekig, tőzsdei nyitvatartás alatt 15 percenként
    - cron: '*/15 8-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Megakadályozza, hogy két futás megszakítsa egymást ("operation was canceled" hiba ellen)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4

      - name: Stooq BET es Mid-Cap adatok lekerese
        run: |
          curl -s "https://stooq.com/q/l/?s=^bux+otp.hu+mol.hu+richt.hu+mtel.hu+opus.hu+4ig.hu+autowallis.hu+alteo.hu+waberers.hu+any.hu+masterplast.hu+pannergy.hu+graphisoft.hu+cigpannonia.hu+appeninn.hu+duna.hu+raba.hu+zwack.hu&f=sd2t2ohlcvn&h&e=csv" -o bet_data.csv

      - name: CSV mentese a repoba (ha valtozott)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bet_data.csv
          git diff --staged --quiet || (git commit -m "Auto-update BET data [skip ci]" && git push)

      - name: GitHub Pages beallitasa
        uses: actions/configure-pages@v5

      - name: Fajlok becsomagolasa a Pages-hez
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy a GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
